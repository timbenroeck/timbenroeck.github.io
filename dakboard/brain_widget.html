<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Brain Spark</title>
<style>
  ::-webkit-scrollbar { width: 0; background: transparent; }
  
  body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background-color: transparent; 
    overflow: hidden;
    height: 100vh;
  }

  .glass-container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    height: 100vh;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: rgba(0, 0, 0, 0.3);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
  }

  .label { font-weight: 800; color: #00d4ff; text-transform: uppercase; font-size: 12px; letter-spacing: 1.5px; }
  .category-tag { 
    font-size: 10px; 
    padding: 2px 8px; 
    border-radius: 10px; 
    background: rgba(255,255,255,0.1);
    color: #ffd700;
  }

  #main-content { flex-grow: 1; position: relative; cursor: pointer; }

  .card-face {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .content-text { 
    font-size: 24px; 
    font-weight: 300; 
    line-height: 1.4; 
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  .reveal-text { 
    font-size: 26px; 
    color: #ffd700; 
    font-weight: 600; 
    margin-top: 15px;
  }
  
  .click-hint { 
    position: absolute;
    bottom: 20px;
    font-size: 9px; 
    color: rgba(255,255,255,0.4); 
    text-transform: uppercase; 
    letter-spacing: 2px; 
  }

  .hidden { display: none !important; }

  /* Smooth Transitions */
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* Unique colors per type */
  .type-riddle { border-left: 4px solid #ff007b; }
  .type-fact { border-left: 4px solid #00ffcc; }
  .type-joke { border-left: 4px solid #ccff00; }
  .type-trivia { border-left: 4px solid #00d4ff; }
</style>
</head>
<body>

<div class="glass-container" id="widget-border">
  <div class="header">
    <div class="header-info">
      <span class="label">Brain Spark</span>
    </div>
    <div id="cat-display" class="category-tag">Loading...</div>
  </div>

  <div id="main-content">
    <div id="front-face" class="card-face fade-in" onclick="handleCardClick()">
        <div id="prompt-content" class="content-text">Initializing...</div>
        <div id="hint-text" class="click-hint">Click to reveal ↻</div>
    </div>

    <div id="back-face" class="card-face fade-in hidden" onclick="handleCardClick()">
        <div id="reveal-content" class="reveal-text"></div>
        <div id="extra-info" style="font-style: italic; color: #bbb; font-size: 14px; margin-top: 10px;"></div>
        <div class="click-hint">Next Spark →</div>
    </div>
  </div>
</div>

  { type: 'fact', q: "Koalas have fingerprints that are...", a: "Indistinguishable from humans", extra: "Detective Koala is on the case." },
  { type: 'fact', q: "Venus is the only planet that...", a: "Rotates clockwise", extra: "A bit of a rebel." },

  { type: 'trivia', q: "What is the hardest natural substance?", a: "Diamond", extra: "Pure carbon, tightly packed." },

  { type: 'trivia', q: "Who was the first person to step on the moon?", a: "Neil Armstrong", extra: "One small step for man..." },

  { type: 'trivia', q: "How many legs does a spider have?", a: "Eight", extra: "Insects have six; spiders are arachnids." }
];

let currentIndex = 0;
let isRevealed = false;

function init() {
    shuffle(library);
    showItem();
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function showItem() {
    const item = library[currentIndex];
    isRevealed = false;

    // Update Category UI
    const catDisplay = document.getElementById('cat-display');
    catDisplay.innerText = item.type.toUpperCase();
    
    // Update border color based on type
    const border = document.getElementById('widget-border');
    border.className = `glass-container type-${item.type}`;

    // Set Text
    document.getElementById('prompt-content').innerText = item.q;
    document.getElementById('reveal-content').innerText = item.a;
    document.getElementById('extra-info').innerText = item.extra || "";

    // Show front, hide back
    document.getElementById('front-face').classList.remove('hidden');
    document.getElementById('back-face').classList.add('hidden');
}

function handleCardClick() {
    if (!isRevealed) {
        // Reveal the answer
        document.getElementById('front-face').classList.add('hidden');
        document.getElementById('back-face').classList.remove('hidden');
        isRevealed = true;
    } else {
        // Move to next item
        currentIndex++;
        if (currentIndex >= library.length) {
            shuffle(library);
            currentIndex = 0;
        }
        showItem();
    }
}

// Auto-rotate every 10 minutes if no one is interacting
setInterval(() => {
    if (!isRevealed) {
        currentIndex = (currentIndex + 1) % library.length;
        showItem();
    }
}, 600000);

init();
</script>
</body>
</html>
