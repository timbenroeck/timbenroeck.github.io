<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Widget</title>
<style>
  ::-webkit-scrollbar { width: 0; background: transparent; }

  body {
    margin: 0; padding: 0;
    font-family: 'Roboto', 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #fff;
    background-color: transparent;
    overflow: hidden;
    height: 100vh;
  }

  .glass-container {
    background: rgba(0, 0, 0, 0.2);
    height: 100vh;
    display: flex;
    flex-direction: column;
    border-left: 4px solid var(--accent);
    box-sizing: border-box;
    --accent: #ffd700;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.4);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
    gap: 8px;
  }

  .tabs, .nav-group { display: flex; gap: 6px; align-items: center; }
  .stats { font-size: 10px; color: rgba(255,255,255,0.5); margin-left: 6px; white-space: nowrap; }

  .btn {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.1);
    user-select: none;
  }
  .btn:active { background: rgba(255, 255, 255, 0.3); }
  .btn.disabled { opacity: 0.3; pointer-events: none; }

  .tab { color: rgba(255,255,255,0.6); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-accent { border-color: var(--accent); color: var(--accent); }
  .btn-filter-active { background: #4da6ff; color: #000; border-color: #fff; }

  #main-content { flex-grow: 1; position: relative; cursor: pointer; }

  .card-face {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 20px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .question-text { font-size: 28px; font-weight: 300; line-height: 1.25; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
  .recap-text { font-size: 16px; font-weight: 300; color: rgba(255,255,255,0.6); margin-bottom: 14px; line-height: 1.3; }
  .answer-text { font-size: 30px; color: #4da6ff; font-weight: 400; margin-bottom: 8px; }
  .meta-text { font-style: italic; color: #bbb; font-size: 18px; }
  .page-ref { color: #ffd700; font-weight: 700; font-size: 14px; margin-left: 10px; }

  .click-hint { font-size: 9px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; margin-top: 15px; }

  .hidden { display: none !important; }

  /* Settings View */
  .settings-view {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 15, 15, 0.98);
    z-index: 20;
    overflow-y: auto;
    padding: 15px 20px;
    cursor: default;
  }
  .settings-flex { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
  .settings-view h4 { width: 100%; margin: 12px 0 6px 0; color: var(--accent); font-size: 12px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .setting-item { display: flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 20px; }
  .footer-btns { display: flex; gap: 10px; padding-bottom: 20px; }
  .save-btn { background: #2E5A1C; border-color: #ffd700; flex: 1; text-align: center; padding: 10px; }
</style>
</head>
<body>

<div class="glass-container" id="container">
  <div class="header">
    <div class="tabs">
      <div class="btn tab" id="tab-obob" onclick="switchMode('obob')">OBOB</div>
      <div class="btn tab" id="tab-brain" onclick="switchMode('brain')">Brain</div>
      <span id="stats" class="stats"></span>
    </div>
    <div class="nav-group">
      <div id="btn-prev" class="btn" onclick="prevCard()">‹ Prev</div>
      <div id="btn-flip" class="btn btn-accent" onclick="flip()">Answer</div>
      <div id="btn-next" class="btn" onclick="nextCard()">Next ›</div>
      <div id="btn-filter" class="btn" onclick="toggleSettings()">Filter</div>
    </div>
  </div>

  <div id="main-content">
    <div id="question-face" class="card-face" onclick="flip()">
      <div id="q-tag" class="tag"></div>
      <div id="q-content" class="question-text">Loading...</div>
      <div class="click-hint">Tap to see answer</div>
    </div>

    <div id="answer-face" class="card-face hidden" onclick="nextCard()">
      <div id="a-tag" class="tag">Answer</div>
      <div id="a-recap" class="recap-text"></div>
      <div id="a-content" class="answer-text"></div>
      <div id="a-meta" class="meta-text"></div>
      <div class="click-hint">Tap for next · Back button to see question</div>
    </div>

    <div id="settings-view" class="settings-view hidden">
      <div class="footer-btns" style="padding-bottom: 0;">
        <div class="btn" onclick="setAllChecks(true)">Select All</div>
        <div class="btn" onclick="setAllChecks(false)">Select None</div>
      </div>
      <div class="settings-flex" id="filter-grid"></div>
      <div class="footer-btns">
        <div class="btn save-btn" onclick="saveFilter()">Apply</div>
        <div class="btn btn-accent" style="padding: 10px;" onclick="resetFilter()">Reset</div>
        <div class="btn" style="background:#444; padding: 10px;" onclick="toggleSettings()">Cancel</div>
      </div>
    </div>
  </div>
</div>

<script>
const OBOB_URL = 'https://raw.githubusercontent.com/timbenroeck/timbenroeck.github.io/refs/heads/site/dakboard/obob/bob2027_all.json';
const BRAIN_URL = 'https://raw.githubusercontent.com/timbenroeck/timbenroeck.github.io/refs/heads/site/dakboard/brain/brain_library.json';
const MODE_KEY = 'quiz_mode';
const AUTO_ROTATE_MS = 600000;

const BRAIN_COLORS = { riddle: '#ff007b', fact: '#00ffcc', joke: '#ccff00', trivia: '#00d4ff' };


// Each mode keeps its own deck, position and filter so switching tabs doesn't lose your place.
const modes = {
  obob: {
    accent: '#ffd700', filterKey: 'obob_filter', items: null, load: loadObob, deck: [], index: 0,
    groups: () => [
      { title: 'Categories', key: 'types', options: [['in-which-book', 'IWB'], ['content', 'Content']] },
      { title: 'Books', key: 'books', options: uniq(modes.obob.items.map(q => q.book_key)).sort().map(bk => [bk, bk.replace(/-/g, ' ')]) },
    ],
    matches: (q, f) => f.types.includes(q.type) && f.books.includes(q.book_key),
    render: renderObob,
  },
  brain: {
    accent: '#00d4ff', filterKey: 'brain_filter', items: null, load: loadBrain, deck: [], index: 0,
    groups: () => [
      { title: 'Categories', key: 'types', options: Object.keys(BRAIN_COLORS).map(t => [t, t]) },
    ],
    matches: (q, f) => f.types.includes(q.type),
    render: renderBrain,
  },
};

let mode = localStorage.getItem(MODE_KEY) || 'obob';
let showingAnswer = false;

const $ = id => document.getElementById(id);
const uniq = arr => [...new Set(arr)];

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

async function loadObob() {
  const response = await fetch(`${OBOB_URL}?t=${Date.now()}`);
  const data = await response.json();
  // Support both the 2025 format (q.book_key) and the 2027 format (q.book.bookKey)
  modes.obob.items = data.questions
    .map(q => ({ ...q, book_key: q.book_key || q.book?.bookKey || q.book?.book_key }))
    .filter(q => q.book_key);
}

async function loadBrain() {
  const response = await fetch(`${BRAIN_URL}?t=${Date.now()}`);
  modes.brain.items = (await response.json()).items;
}

// --- Filters ---

function defaultFilter(m) {
  const f = {};
  modes[m].groups().forEach(g => f[g.key] = g.options.map(o => o[0]));
  return f;
}

function getFilter(m) {
  const all = defaultFilter(m);
  const saved = JSON.parse(localStorage.getItem(modes[m].filterKey) || 'null');
  if (!saved) return all;
  // Drop saved values that no longer exist; fall back to all if nothing is left
  for (const key in all) {
    const kept = (saved[key] || []).filter(v => all[key].includes(v));
    all[key] = kept.length ? kept : all[key];
  }
  return all;
}

function isFiltered(m) {
  const f = getFilter(m), all = defaultFilter(m);
  return Object.keys(all).some(k => f[k].length < all[k].length);
}

function buildDeck(m) {
  const f = getFilter(m);
  modes[m].deck = shuffle(modes[m].items.filter(q => modes[m].matches(q, f)));
  modes[m].index = 0;
}

// --- Mode switching ---

async function switchMode(m) {
  mode = m;
  localStorage.setItem(MODE_KEY, m);
  $('settings-view').classList.add('hidden');
  $('container').style.setProperty('--accent', modes[m].accent);
  $('tab-obob').classList.toggle('active', m === 'obob');
  $('tab-brain').classList.toggle('active', m === 'brain');

  const st = modes[m];
  if (!st.items) {
    $('q-content').innerText = 'Loading questions...';
    showFace(false);
    try { await st.load(); } catch (e) { $('q-content').innerText = 'Load error.'; return; }
    if (mode !== m) return;
  }
  if (!st.deck.length) buildDeck(m);
  showCard();
}

// --- Card display ---

function current() {
  const st = modes[mode];
  return st.deck[st.index];
}

function showCard() {
  const st = modes[mode], item = current();
  $('stats').innerText = mode === 'obob'
    ? `${getFilter('obob').books.length} Books | ${st.deck.length} Qs`
    : `${st.index + 1} / ${st.deck.length}`;
  $('btn-filter').classList.toggle('btn-filter-active', isFiltered(mode));
  $('btn-prev').classList.toggle('disabled', st.index === 0);

  if (!item) {
    $('q-tag').innerText = '';
    $('q-content').innerText = 'No questions match this filter.';
    showFace(false);
    return;
  }
  const c = st.render(item);
  $('q-tag').innerText = c.tag;
  $('q-content').innerHTML = c.question;
  $('a-recap').innerHTML = c.question;
  $('a-content').innerHTML = c.answer;
  $('a-meta').innerHTML = c.meta;
  if (mode === 'brain') $('container').style.setProperty('--accent', BRAIN_COLORS[item.type]);
  showFace(false);
}

function renderObob(item) {
  const pageRef = item.page ? `<span class="page-ref">pg. ${item.page}</span>` : '';
  if (item.type === 'in-which-book') {
    return {
      tag: 'In which book',
      question: (item.text.toLowerCase().startsWith('in which book') ? '' : 'In which book ') + item.text,
      answer: `${item.book.title} by ${item.book.author}${pageRef}`,
      meta: '',
    };
  }
  return {
    tag: 'Content',
    question: `In <i>${item.book.title}</i> by ${item.book.author}, ${item.text}`,
    answer: `${item.answer}${pageRef}`,
    meta: `Book: ${item.book.title}`,
  };
}

function renderBrain(item) {
  return { tag: item.type, question: item.q, answer: item.a, meta: item.extra || '' };
}

function showFace(answer) {
  showingAnswer = answer;
  $('question-face').classList.toggle('hidden', answer);
  $('answer-face').classList.toggle('hidden', !answer);
  $('btn-flip').innerText = answer ? '← Back' : 'Answer';
}

// --- Navigation ---

function flip() {
  if (current()) showFace(!showingAnswer);
}

function nextCard() {
  const st = modes[mode];
  if (!st.deck.length) return;
  st.index++;
  if (st.index >= st.deck.length) { shuffle(st.deck); st.index = 0; }
  showCard();
}

function prevCard() {
  const st = modes[mode];
  if (st.index > 0) { st.index--; showCard(); }
}

// --- Settings ---

function toggleSettings() {
  const view = $('settings-view');
  view.classList.toggle('hidden');
  if (view.classList.contains('hidden') || !modes[mode].items) return;
  const f = getFilter(mode);
  $('filter-grid').innerHTML = modes[mode].groups().map(g => `
    <h4>${g.title}</h4>
    ${g.options.map(([value, label]) => `
      <label class="setting-item">
        <input type="checkbox" class="filter-chk" data-key="${g.key}" value="${value}" ${f[g.key].includes(value) ? 'checked' : ''}>
        ${label}
      </label>`).join('')}
  `).join('');
}

function setAllChecks(checked) {
  document.querySelectorAll('.filter-chk').forEach(el => el.checked = checked);
}

function saveFilter() {
  const f = {};
  modes[mode].groups().forEach(g => f[g.key] = []);
  document.querySelectorAll('.filter-chk:checked').forEach(el => f[el.dataset.key].push(el.value));
  localStorage.setItem(modes[mode].filterKey, JSON.stringify(f));
  $('settings-view').classList.add('hidden');
  buildDeck(mode);
  showCard();
}

function resetFilter() {
  localStorage.removeItem(modes[mode].filterKey);
  $('settings-view').classList.add('hidden');
  buildDeck(mode);
  showCard();
}

switchMode(mode in modes ? mode : 'obob');

// Auto-rotate if nobody has revealed the answer
setInterval(() => {
  if (!showingAnswer && $('settings-view').classList.contains('hidden')) nextCard();
}, AUTO_ROTATE_MS);
</script>
</body>
</html>
